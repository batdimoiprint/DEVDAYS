<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cue-pid</title>
<style>
  :root{--pink:#a51f50;--deep:#2b0a3d;--gold:#ffd166;--card:#fff7fb;--ink:#2b0a3d}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
    background:#24152f;min-height:100vh;padding:20px 16px 60px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:2.6rem;margin:6px 0 0;letter-spacing:-1px;text-align:center}
  h1 span{color:#ff9abd}
  .tag{text-align:center;color:#fff;margin:4px 0 18px;font-size:1rem}
  .panel{background:#ffffff14;border:1px solid #ffffff22;border-radius:16px;padding:16px}
  input,textarea{width:100%;padding:12px;border-radius:10px;border:none;font-size:1rem;margin-bottom:10px;font-family:inherit}
  textarea{min-height:110px;resize:vertical}
  .plus{text-align:center;font-size:1.4rem;margin:-4px 0 6px}
  button.go{width:100%;padding:14px;border:none;border-radius:12px;background:#bf235d;
    color:#fff;font-size:1.05rem;font-weight:800;cursor:pointer}
  button.go:active{transform:scale(.98)}
  .loading{text-align:center;padding:30px 10px;font-weight:700}
  .heart{display:inline-block;animation:beat .7s infinite;font-size:2rem}
  @keyframes beat{50%{transform:scale(1.35)}}
  .card{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;margin-top:16px;
    box-shadow:0 10px 30px #0006;animation:pop .35s ease}
  @keyframes pop{from{transform:scale(.92);opacity:0}}
  .pair{font-size:1rem;color:#57465a;text-align:center}
  .ship{font-size:clamp(1.4rem,5vw,2.1rem);font-weight:900;text-align:center;color:var(--pink);margin:2px 0}
  .tier{text-align:center;font-weight:800;margin-bottom:10px}
  .bar{height:16px;background:#e8d5e8;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#bf235d;transition:width 1.2s ease}
  .score{text-align:center;font-weight:900;font-size:1.4rem;margin:6px 0 10px}
  .row{margin:10px 0;font-size:.95rem;line-height:1.4}
  .row b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:#8a3a8a}
  .quote{border-left:4px solid var(--pink);padding-left:10px;font-style:italic}
  .tiny{font-size:.85rem;color:#e9dfea;margin-top:10px;text-align:center}
  .copy{margin-top:10px;width:100%;padding:9px;border-radius:10px;border:2px dashed var(--pink);background:transparent;color:var(--pink);font-weight:700;cursor:pointer}
  .mini{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .mini .ship{font-size:1.2rem;text-align:left}
  .mini .s{font-weight:900;font-size:1.3rem}
  .lang{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:4px}
  .lang button{padding:5px 12px;border-radius:99px;border:1px solid #ffffff44;background:transparent;color:#fff;font-weight:700;cursor:pointer;font-size:.8rem}
  .lang button.on{background:#fff;color:#2b0a3d}
  .hide{display:none}
  .wheel-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .wheel-inputs[hidden]{display:none}
  .wheel-inputs label{font-weight:700;font-size:.8rem}
  .wheel-inputs textarea{margin-top:6px;min-height:78px;font-size:.85rem}
  .wheels{display:flex;justify-content:center;margin:18px 0}
  .wheel-stage{position:relative;width:min(100%,400px);aspect-ratio:1;margin:20px 0}
  .wheel-pointer{position:absolute;left:50%;transform:translateX(-50%);color:var(--gold);font-size:25px;line-height:1;z-index:3;white-space:nowrap}
  .wheel-pointer span{font-size:13px;font-weight:700;vertical-align:middle;color:#fff}
  .female-pointer{top:-25px}.male-pointer{top:79%}
  .wheel{position:absolute;border:4px solid #ffd166;border-radius:50%;transition:transform 3s cubic-bezier(.12,.74,.15,1);box-shadow:0 6px 24px #0006}
  #femaleWheel{inset:0;width:100%;height:100%}
  #maleWheel{inset:21%;width:58%;height:58%;z-index:1;border-color:#fff}
  .spin-result{text-align:center;font-weight:800;min-height:1.5em;margin-bottom:10px}
  .pair-list{list-style:none;padding:0;margin:12px 0 18px;font-size:1rem;line-height:1.5}
  .pair-list li{padding:5px 0;border-bottom:1px solid #ffffff33;text-align:center}
  button:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
  dialog{width:min(520px,calc(100% - 32px));max-height:90vh;overflow:auto;border:0;padding:0;background:transparent}
  dialog::backdrop{background:#12031ccc}
  dialog .card{margin:0;position:relative}
  .close-modal{position:absolute;z-index:2;right:12px;top:12px;border:0;background:transparent;color:var(--deep);font-size:1.5rem;cursor:pointer}
  .video-code{margin-top:8px;border:1px solid #ead0df}
  .video-note{font-size:.8rem;line-height:1.4}
  .video-placeholder{display:grid;place-items:center;aspect-ratio:16/9;margin-top:14px;border-radius:10px;background:#e8dfe7;color:#514353;font-size:.9rem}
  video{display:block;width:100%;border-radius:10px;margin-top:14px}
  video[hidden]{display:none}
  button:disabled{opacity:.55;cursor:wait}
  @media(prefers-reduced-motion:reduce){.wheel{transition-duration:.01s}}

</style>
</head>
<body>
<div class="wrap">
  <div class="lang"><button data-l="tl" class="on">Taglish</button><button data-l="en">English</button></div>
  <h1>cue-<span>pid</span></h1>
  <div class="tag" id="tag">Paikutin ang wheel para makita ang match.</div>

  <div class="panel" id="duo">
    <div class="wheel-inputs" hidden>
      <label>Female characters<textarea id="femaleNames" aria-label="Female character names" readonly>Gehlee
Queen Leng
Kara David</textarea></label>
      <label>Male characters<textarea id="maleNames" aria-label="Male character names" readonly>Jeo Ong
Xander Ford
Dinorobong Tubo</textarea></label>
    </div>
    <div class="wheels"><div class="wheel-stage">
      <div class="wheel-pointer female-pointer" aria-hidden="true"><span>FEMALE</span> ▼</div>
      <svg id="femaleWheel" class="wheel" viewBox="0 0 200 200" aria-label="Female character wheel"></svg>
      <svg id="maleWheel" class="wheel" viewBox="0 0 200 200" aria-label="Male character wheel"></svg>
      <div class="wheel-pointer male-pointer" aria-hidden="true">▲ <span>MALE</span></div>
    </div></div>
    <ul class="pair-list" aria-label="Possible matches">
      <li>Gehlee + Jeo Ong</li>
      <li>Queen Leng + Xander Ford</li>
      <li>Kara David + Dinorobong Tubo</li>
    </ul>
    <div id="spinResult" class="spin-result" aria-live="polite">Spin to find a match.</div>
    <button class="go" id="spinWheel" type="button">Spin the wheel</button>
    <div hidden>
    <input id="n1" placeholder="Pangalan #1 (e.g. Mark)" autocomplete="off">
    <div class="plus">+</div>
    <input id="n2" placeholder="Pangalan #2 (e.g. Anna)" autocomplete="off">
    <button class="go" id="goDuo">Cue the Music</button>
    </div>
  </div>

  <dialog id="out" aria-label="Your match"></dialog>
  <div class="tiny" id="foot" style="margin-top:20px">For entertainment only.</div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.split(/\s+/).map(word=>word.charAt(0).toUpperCase()+word.slice(1).toLowerCase()).join(" ");

// deterministic randomness: same pair => same fate, always
function hash(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(a,r)=>a[Math.floor(r()*a.length)];

const LOADING=[
  "Kinakausap si Kuya Big Brother...",
  "Chinecheck ang group chat ng mga tita...",
  "Binabasa ang tarot ni Aling Nena...",
  "Hinihintay ang commercial break...",
  "Sinusuri ang eye contact sa canteen...",
  "Nagda-download ng kilig (73% pa lang)...",
  "Tinatanong ang crush ng bayan..."
];

 {max:49,name:"KILIG PERO KUNWARI HINDI",lines:[
  "Si {a} nagpapanggap na walang paki, si {b} nag-stalk na ng 2019 photos. Iba 'to.",
  "Hindi pa sila, pero pareho na silang naka-online at naghihintay mag-type ng 'uy'.",
  "{a} says 'friends lang'. {b} says 'oo nga'. Both lying. Both knows. Both gagi."]},
 {max:74,name:"SLOW-BURN TELESERYE",lines:[
  "Tatlong season pa bago umamin si {a}, at si {b} kunwari nagulat. Classic.",
  "May ulan, may payong, may eksenang nagkahawak ang kamay. Kumpleto na ang requirements.",
  "{a} and {b} will take 40 episodes to say 'mahal kita' and 41 to say it properly."]},
 {max:89,name:"PRIME TIME LOVE TEAM",lines:[
  "Billboard-ready! Ang fans ni {a} at {b} naka-all caps na sa comment section.",
  "Sold out ang fan meeting bago pa magsimula. Hindi pa nga kayo, may merch na.",
  "{a} and {b}: nagkatinginan lang, 5 million views na agad."]},
 {max:100,name:"WALANG KUPAS, 20 YEARS PA!",lines:[
  "Destined ito. Pati si Mother Lily napapa-sign of the cross. {a} and {b} for the history books.",
  "Si Big Brother mismo nag-confess sa inyo. Wala na, tapos na ang laban.",
  "Kahit pagbuhulin ang ugat ng puno, {a} and {b} pa rin. Teleserye finale, kasalan agad."]}
];

const CONFESSION=[
 "Big Brother, hindi ko po alam kung bakit ako kinikilig... pero {b} lang po ang kailangan ko today.",
 "Big Brother, may ka-chat po ako. Hindi ko po sasabihin kung sino. ({b}, ikaw 'yun.)",
 "Big Brother, nagselos po ako nung may ibang kumain ng pagkain ni {b}. Hindi po ako okay.",
 "Big Brother, pakiusap po, ilayo niyo na si {b}. Hindi ko na po kayang magpanggap na chill.",

 "Big Brother, bakit po parang lagi na lang may background music pag dumadaan si {b}?"
];

];
const GREEN=[
 "nag-aabot ng tubig nang hindi hinihingi","lagi pa ring nagre-reply kahit 2AM","alam ang order mo sa milk tea",
 "tumatawa sa corny jokes mo (kahit hindi nakakatawa)","nagpapahiram ng jacket kahit malamig din sila"
];
const RED=[
 "nag-'k' lang bilang reply","may 14 unread na chat pero 'busy' daw","laging 'on the way' (hindi pa naligo)",
 "'wala lang' ang sagot sa 'anong problema?'","ikaw ang mag-sagot ng GCash pero 'ililibre kita next time'"
];
const SIDE=[
 "Pagngiti habang nagtitingin sa phone, biglang pag-'ehem', paulit-ulit na pag-check ng reflection",
 "Pamumula ng pisngi sa group project, pagkawala ng gutom sa harap ng crush",

];
const FRIEND=[
 "Si Bestie na laging 'ako na bahala' pero siya ang nagpapalala","Si Tita sa GC na unang nakaalam pero 'secret' daw",
 "Si Kuya Guard na may bet kung sino ang unang aamin","Si Classmate na nag-sign na 'bagay kayo' sa lahat ng group photo"
];

function shipName(a,b){
  const A=a.slice(0,Math.ceil(a.length/2)), B=b.slice(Math.floor(b.length/2));
  const A2=b.slice(0,Math.ceil(b.length/2)), B2=a.slice(Math.floor(a.length/2));
  return {main:cap(A+B),alt:cap(A2+B2)};
}

function match(n1,n2){
  const a=cap(n1.trim()),b=cap(n2.trim());
  const key=[a,b].map(x=>x.toLowerCase()).sort().join('|');
  const r=rng(hash(key));
  let score=Math.floor(r()*101);
  let tier=D().TIERS.find(t=>score<=t.max);
  let line=pick(tier.lines,r).replaceAll('{a}',a).replaceAll('{b}',b);
  const sn=shipName(a,b);
  if(a.toLowerCase()===b.toLowerCase()){
    score=100;tier=D().TIERS[4];
    line=U().selfLove(a);
  }
  return {
    a,b,score,tier,line,
    ship:sn.main,alt:sn.alt,
    confession:pick(D().CONFESSION,r).replaceAll('{a}',a).replaceAll('{b}',b),
    twist:pick(D().TWIST,r).replaceAll('{a}',a).replaceAll('{b}',b),
    green:pick(D().GREEN,r),red:pick(D().RED,r),side:pick(D().SIDE,r),friend:pick(D().FRIEND,r),
    tag:`#${a}${b}${U().tagSuf}`.replace(/\s/g,''),
    key,
    story:makeStory(a,b,D().TIERS.indexOf(tier),r),
    pun:pick(D().PUNS,r).replaceAll('{a}',a).replaceAll('{b}',b)
  };
}

const OPEN=[

 "Biglang nawalan ng signal si {a} sa gitna ng confession. Pagbalik ng signal, ang narinig lang ni {b} ay 'mahal... lag... ka'.",
 "Lumipat si {b} ng probinsya. Hinabol ni {a} ang bus. 'Hintay!' sigaw niya. Hindi huminto ang bus. Huminto lang ang puso."];
const END=[
 ["Natapos sa 'friends na lang tayo.' Pero ang epilogue: nagwa-wave pa rin sila sa isa't isa tuwing nagkakasalubong. Season 2, mahaba pa ang daan.",
  "Walang romance, pero may lifetime supply ng asaran. Ang finale: group photo na silang dalawa ang magkatabi. Coincidence daw."],
 ["Nag-confess si {a}, nag-'ha?' si {b}, tapos nagtawanan. Hindi pa sila, pero may inside joke na sila forever. Bitin pero cute.",
  "Hindi sila naging official, pero tuwing may kasalan, magkatabi sila sa upuan at nagbubulungan. Cliffhanger."],

  "Ang finale: 50 taon na silang magkasama, nagtatalo pa rin kung sino ang unang nag-'hi.' Sagot ni Kuya Big Brother: 'Parehas.' Roll credits."]

const GENRES=[

  open:[

  o.connect(g);g.connect(bus);o.start(t);o.stop(t+.25);
}

// genre -> instrument palette (same order as GENRES in both languages)
const MCFG=[
 {bpm:78,lead:'triangle',pluck:true,step:1,rest:.15,pad:'sine',padLp:2000,bass:'whole',drums:'none'},
 {bpm:118,lead:'square',pluck:true,step:.5,rest:.1,pad:'triangle',padLp:2500,bass:'bounce',drums:'pop',pent:true,lp:3000},
 {bpm:92,lead:'sine',pluck:true,step:1,rest:.5,pad:'sawtooth',padLp:500,bass:'pulse',drums:'heart',vib:6},
 {bpm:128,lead:'sawtooth',pluck:false,step:.5,rest:.1,pad:'sawtooth',padLp:900,bass:'oompah',drums:'shaker',pent:true,lp:2200},
 {bpm:124,lead:'square',pluck:false,step:.25,rest:0,pad:'sawtooth',padLp:1200,bass:'pump',drums:'four',arp:true,lp:4000}
];
const SCALE={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10]};
const PROGS={maj:[[0,4,5,3],[0,5,3,4],[5,3,0,4]],min:[[0,5,2,6],[0,3,6,2],[0,6,5,4]]};
const ALLOW={maj:[0,1,2,4,5],min:[0,2,3,4,6]};

// 24 s, matches the trailer: title 0-3, Ep1 3-8.5, Ep2 8.5-14, finale 14-19.5, end card 19.5-24
function scheduleMusic(m,bus,T0){
  const r=rng(hash(m.key+'music'));
  const ti=D().TIERS.findIndex(x=>x.name===m.tier.name);
  const gi=Math.max(0,D().GENRES.findIndex(g=>g.name===m.story.genre));
  const C=MCFG[gi];
  const beat=60/(C.bpm*(ti<=1?.88:ti===4?1.05:1));
  const root=pick([55,57,58,60,62],r);
  const mid=(mode,deg)=>root+SCALE[mode][((deg%7)+7)%7]+12*Math.floor(deg/7);
  const modeA=gi===2?'min':(ti>=2?'maj':'min'),modeB='min',modeC=gi===2?(ti>=3?'maj':'min'):(ti>=2?'maj':'min');
  const secs=[[0,3,modeA],[3,8.5,modeA],[8.5,14,modeB],[14,19.5,modeC],[19.5,24,modeC]];
  let cur=9;
  secs.forEach(([a,b,mode],si)=>{
    const A=T0+a;
    if(si===0){
      [0,2,4].forEach(x=>tone(bus,C.pad,mtof(mid(mode,x)),A,3.2,.04,{a:.5,r:.4,lp:C.padLp}));
      riser(bus,A+.2,2.7,.05);
      tone(bus,'sine',mtof(mid(mode,7)+12),A+2.2,1.2,.06,{pluck:true});
      return;
    }
    if(si===4){
      [0,2,4].forEach(x=>tone(bus,C.pad,mtof(mid(mode,x)),A,4.4,.04,{a:.2,r:1.5,lp:C.padLp}));
      if(ti===0){
        [[7,.7],[6,.7],[5,.7],[4,1.6]].forEach(([n,d],i)=>{
          const t=A+.2+[0,.8,1.6,2.5][i],f=mtof(root+n);
          tone(bus,'sawtooth',f,t,d,.1,{lp:700,a:.05,r:.1,slideTo:i===3?f*.7:undefined});
        });
      }else{
        [0,2,4,7,4,2].forEach((x,i)=>tone(bus,'sine',mtof(mid(mode,x)+12),A+i*beat,beat*2,.07*(1-i/8),{pluck:true}));
      }
      return;
    }
    const prog=pick(PROGS[mode],r);
    let t=a,k=0;
    while(t<b-1e-6){
      const cl=Math.min(beat*2,b-t),d=prog[k%4],tt=T0+t,triad=[d,d+2,d+4];
      // pad
      triad.forEach(x=>tone(bus,C.pad,mtof(mid(mode,x)),tt,cl,.032,{a:.08,r:.15,lp:C.padLp}));
      // bass
      const bn=mid(mode,d)-12,nb=Math.max(1,Math.round(cl/beat));
      if(C.bass==='whole')tone(bus,'sine',mtof(bn),tt,cl,.12,{a:.03,r:.2});
      else if(C.bass==='bounce'||C.bass==='pump'){
        const n=Math.max(1,Math.round(cl/(beat/2)));
        for(let i=0;i<n;i++)tone(bus,C.bass==='pump'?'square':'triangle',mtof(bn+(C.bass==='bounce'&&i%2?7:0)),tt+i*beat/2,beat/2*.8,C.bass==='pump'?.07:.1,{pluck:true,lp:C.bass==='pump'?500:900});
      }else if(C.bass==='pulse'){
        tone(bus,'sine',mtof(bn),tt,beat*.9,.12,{pluck:true});
        if(cl>beat)tone(bus,'sine',mtof(bn),tt+beat,beat*.6,.09,{pluck:true});
      }else if(C.bass==='oompah'){
        for(let i=0;i<nb;i++){
          if(i%2===0)tone(bus,'triangle',mtof(bn),tt+i*beat,beat*.6,.12,{pluck:true});
          else triad.forEach(x=>tone(bus,'sawtooth',mtof(mid(mode,x)),tt+i*beat,beat*.35,.025,{pluck:true,lp:1500}));
        }
      }
      // drums (the sad finale stays bare)
      if(!(si===3&&ti<=1)){
        for(let i=0;i<nb;i++){
          const bt=tt+i*beat;
          if(C.drums==='pop'){if(i%2===0)kick(bus,bt,.5);else noise(bus,bt,.15,.12,'highpass',1800);noise(bus,bt,.04,.05,'highpass',7000);noise(bus,bt+beat/2,.04,.04,'highpass',7000)}
          else if(C.drums==='shaker'){if(i%2===0)kick(bus,bt,.35);noise(bus,bt,.05,.06,'highpass',6000);noise(bus,bt+beat/2,.05,.04,'highpass',6000)}
          else if(C.drums==='four'){kick(bus,bt,.5);noise(bus,bt+beat/2,.05,.07,'highpass',7500)}
          else if(C.drums==='heart'){if(i%2===0){kick(bus,bt,.3);kick(bus,bt+beat*.3,.2)}}
        }
      }
      // lead
      const stepLen=beat*C.step*(si===2&&!C.arp?.5:1),ns=Math.floor(cl/stepLen+1e-6);
      const chordTones=triad.map(x=>((x%7)+7)%7),oct=(C.arp?12:0)+(si===3&&ti>=3?12:0);
      for(let i=0;i<ns;i++){
        if(r()<C.rest+(si===3&&ti<=1?.3:0))continue;
        let midi;
        if(C.arp){const seq=[d,d+2,d+4,d+7,d+4,d+2];midi=mid(mode,seq[(i+k*3)%6])+oct}
        else{
          cur+=pick([-2,-1,-1,0,1,1,2],r);cur=Math.max(2,Math.min(16,cur));
          if(C.pent){let g=0;while(!ALLOW[mode].includes(((cur%7)+7)%7)&&g++<7)cur++}
          if(i%2===0){for(const off of [0,1,-1,2,-2]){if(chordTones.includes((((cur+off)%7)+7)%7)){cur+=off;break}}}
          cur=Math.max(2,Math.min(16,cur));
          midi=mid(mode,cur)+oct;
        }
        tone(bus,C.lead,mtof(midi),T0+t+i*stepLen,stepLen*(C.pluck?1.6:.95),(C.arp?.05:.075)*(si===3&&ti<=1?.8:1),{pluck:C.pluck,lp:C.lp,vib:C.vib,a:C.pluck?.01:.03});
      }
      t+=cl;k++;
    }
    // section events
    if(si===2){
      kick(bus,A,.7);noise(bus,A,.6,.2,'lowpass',2000,200);
      if(gi===2){tone(bus,'sawtooth',mtof(root-12),A,.8,.1,{lp:400,slideTo:mtof(root-12)*.8});tone(bus,'sine',mtof(root+18),A,.8,.05)}
      if(gi===4){for(let i=0;i<40;i++)if(r()<.4)tone(bus,'square',mtof(root+24+SCALE.min[Math.floor(r()*7)]),A+.5+i*.12,.06,.04,{pluck:true})}
      riser(bus,T0+12,1.9,.07);
    }
    if(si===3){
      if(ti>=2)noise(bus,A,1.4,.15,'highpass',5000);
      if(ti===4){[0,4,0].forEach((x,i)=>[0,2,4].forEach(y=>tone(bus,'sawtooth',mtof(mid(mode,x+y)),A+i*beat,beat*.9,.05,{lp:1800,a:.02,r:.1})))}
      if(gi===4&&ti>=2){tone(bus,'sine',mtof(root+31),A+.05,1,.07,{pluck:true});tone(bus,'sine',mtof(root+36),A+.2,1,.06,{pluck:true})}
    }
  });
  bus.gain.setValueAtTime(1,T0+23);bus.gain.linearRampToValueAtTime(0,T0+24);
}
function playMusic(m){
  if(!MUSIC_ON)return;
  try{
    const ac=audioCtx();if(!ac)return;
    stopMusic();
    const bus=ac.createGain();bus.gain.value=1;bus.connect(MASTER);CUR_BUS=bus;
    scheduleMusic(m,bus,ac.currentTime+.08);
  }catch(e){console.warn('music',e)}
}

let LASTM=null;
const ease=p=>1-Math.pow(1-p,3);
function heart(ctx,x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.3);ctx.bezierCurveTo(x,y-s*.3,x-s,y-s*.3,x-s,y+s*.3);ctx.bezierCurveTo(x-s,y+s*.8,x,y+s,x,y+s*1.3);ctx.bezierCurveTo(x,y+s,x+s,y+s*.8,x+s,y+s*.3);ctx.bezierCurveTo(x+s,y-s*.3,x,y-s*.3,x,y+s*.3);ctx.fill()}
function wrapText(ctx,text,maxW){const words=text.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}

function drawTrailer(ctx,img,m,SEG,t){
  const W=800,H=450;
  ctx.globalAlpha=1;ctx.textAlign='center';
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const s=SEG.find(x=>t>=x.t&&t<x.t+x.d)||SEG[SEG.length-1];
  const p=Math.min(1,Math.max(0,(t-s.t)/s.d));
  if(s.type==='title'||s.type==='end'){
    ctx.fillStyle=s.type==='title'?'#2b0a3d':'#bf235d';ctx.fillRect(0,0,W,H);
    for(let i=0;i<10;i++){ctx.fillStyle='rgba(255,255,255,'+(0.12+(i%3)*0.07)+')';heart(ctx,(i*97+t*20)%W,H-((t*45+i*61)%(H+40)),6+(i%4)*3)}
    if(s.type==='title'){
      ctx.fillStyle='rgba(255,255,255,'+Math.min(1,p*3)+')';ctx.font='600 20px system-ui,sans-serif';ctx.fillText('cue-pid presents',W/2,130);
      let fs=84;ctx.font='900 '+fs+'px system-ui,sans-serif';
      while(ctx.measureText(m.ship).width>680&&fs>30){fs-=6;ctx.font='900 '+fs+'px system-ui,sans-serif'}
      const sc=0.6+0.4*ease(Math.min(1,p*2));
      ctx.save();ctx.translate(W/2,235);ctx.scale(sc,sc);ctx.globalAlpha=Math.min(1,p*3);ctx.fillStyle='#ff4d8d';ctx.fillText(m.ship,0,0);ctx.restore();
      ctx.globalAlpha=Math.min(1,Math.max(0,(p-.4)*3));ctx.fillStyle='#fff';
      ctx.font='700 24px system-ui,sans-serif';ctx.fillText(m.a+'  +  '+m.b,W/2,290);
      ctx.font='500 20px system-ui,sans-serif';ctx.fillText(U().aGenre(m.story.genre),W/2,330);
      ctx.globalAlpha=1;
    }else{
      ctx.fillStyle='#fff';ctx.font='700 22px system-ui,sans-serif';ctx.fillText(U().scoreCap,W/2,95);
      const sc=Math.round(m.score*ease(Math.min(1,p*1.6)));
      ctx.fillStyle='#ffd166';ctx.font='900 110px system-ui,sans-serif';ctx.fillText(sc+'/100',W/2,205);
      ctx.fillStyle='#fff';ctx.font='800 26px system-ui,sans-serif';ctx.fillText(m.tier.name,W/2,252);
      ctx.font='italic 21px system-ui,sans-serif';
      wrapText(ctx,m.pun,700).forEach((l,i)=>ctx.fillText(l,W/2,308+i*28));
      ctx.fillStyle='#ffc2dc';ctx.font='700 20px system-ui,sans-serif';ctx.fillText(m.tag,W/2,396);
      ctx.fillStyle='#fff';ctx.font='900 24px system-ui,sans-serif';ctx.fillText('cue-pid',W/2,430);
    }
  }else{
    const z=s.zoom[0]+(s.zoom[1]-s.zoom[0])*ease(p);
    let ox=0,oy=0;if(s.shake){ox=Math.sin(t*50)*5*(1-p);oy=Math.cos(t*43)*4*(1-p)}
    const w=800*z,h=480*z;
    ctx.drawImage(img,400-w/2+ox,225-h/2+oy,w,h);
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,230,W,220);
    if(s.hearts){ctx.fillStyle='rgba(255,77,141,.85)';for(let i=0;i<14;i++)heart(ctx,(i*61+30)%W,H-((t*70+i*43)%(H+30)),7+(i%4)*4)}
    if(s.shake&&p<.1){ctx.fillStyle='rgba(255,0,0,'+(0.3*(1-p/.1))+')';ctx.fillRect(0,0,W,H)}
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,34);
    ctx.textAlign='left';ctx.fillStyle='#ffd166';ctx.font='800 18px system-ui,sans-serif';ctx.fillText(s.label,16,24);
    ctx.textAlign='right';ctx.fillStyle='#fff';ctx.fillText('cue-pid',W-16,24);
    ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='600 19px system-ui,sans-serif';
    const lines=wrapText(ctx,s.text,720);let rem=Math.floor(s.text.length*Math.min(1,p/.75));
    lines.forEach((l,i)=>{ctx.fillText(l.slice(0,Math.max(0,Math.min(l.length,rem))),40,314+i*26);rem-=l.length+1});
  }
  const f=Math.min(1,(t-s.t)/.35);
  if(f<1){ctx.fillStyle='rgba(0,0,0,'+(1-f)+')';ctx.fillRect(0,0,W,H)}
}

function makeTrailer(m){
  const box=$('#trailerBox');if(!box)return;
  box.innerHTML='<canvas id="tc" width="800" height="450" style="width:100%;border-radius:14px;background:#000;margin-top:8px;display:block"></canvas><div id="tstat" class="tiny" style="color:#2b0a3d">'+U().rendering+'</div>';
  const cv=$('#tc'),ctx=cv.getContext('2d');
  const SEG=[
    {t:0,d:3,type:'title'},
    {t:3,d:5.5,type:'scene',label:U().ep1,text:m.story.parts[0],zoom:[1,1.15]},
    {t:8.5,d:5.5,type:'scene',label:U().ep2,text:m.story.parts[1],zoom:[1.15,1],shake:true},
    {t:14,d:5.5,type:'scene',label:U().ep3,text:m.story.parts[2],zoom:[1,1.2],hearts:true},
    {t:19.5,d:4.5,type:'end'}
  ];
  const TOTAL=24;
  const img=new Image();
  img.onload=()=>{
    let rec=null,chunks=[],mime='';
    try{
      if(window.MediaRecorder&&cv.captureStream){
        mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x))||'';
        if(mime){
          const vs=cv.captureStream(30);
          if(MUSIC_ON&&audioCtx()&&MDEST)MDEST.stream.getAudioTracks().forEach(tr=>vs.addTrack(tr));
          rec=new MediaRecorder(vs,{mimeType:mime});
          rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
          rec.onstop=()=>finish(URL.createObjectURL(new Blob(chunks,{type:mime})),mime.indexOf('mp4')>=0?'mp4':'webm');
          rec.start();
        }
      }
    }catch(e){rec=null}
    if(MUSIC_ON)playMusic(m);
    const t0=performance.now();
    const tick=now=>{
      const t=Math.min(TOTAL,(now-t0)/1000);
      drawTrailer(ctx,img,m,SEG,t);
      if(t<TOTAL)requestAnimationFrame(tick);
      else if(rec&&rec.state!=='inactive')rec.stop();
      else finish(null,'');
    };
    requestAnimationFrame(tick);
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sceneSVG(m));
  function finish(url,ext){
    let h='';
    if(url)h+='<a href="'+url+'" download="cue-pid-trailer.'+ext+'" style="display:block;text-align:center;margin-top:8px;padding:9px;border-radius:10px;border:2px dashed #ff4d8d;color:#ff4d8d;font-weight:700;text-decoration:none">'+U().download(ext)+'</a>';
    h+='<button class="go trailer" style="margin-top:8px">'+U().replay+'</button>';
    $('#tstat').innerHTML=h;
  }
}

    const x=el.id==='femaleWheel'?178:170;
    const words=name.split(/\s+/);
    const lines=words.map((word,index)=>'<tspan x="'+x+'" dy="'+(index===0?-(words.length-1)*5:11)+'"'+(word.length>9?' textLength="62" lengthAdjust="spacingAndGlyphs"':'')+'>'+esc(word)+'</tspan>').join('');
    return path+'<text x="'+x+'" y="104" transform="rotate('+angle+' 100 100) rotate(90 '+x+' 100)" fill="white" font-size="11" font-weight="bold" text-anchor="middle">'+lines+'</text>';
  }).join('');
}
function renderWheels(){drawWheel($('#femaleWheel'),lists('#femaleNames'));drawWheel($('#maleWheel'),lists('#maleNames'))}
$('#femaleNames').addEventListener('input',renderWheels);$('#maleNames').addEventListener('input',renderWheels);renderWheels();
$('#spinWheel').onclick=()=>{
  const groups=[lists('#femaleNames'),lists('#maleNames')];
  if(groups.some(x=>!x.length)){ $('#spinResult').textContent='Add at least one name to each wheel.';return }
  const button=$('#spinWheel');button.disabled=true;$('#femaleNames').disabled=true;$('#maleNames').disabled=true;
  const pairIndex=Math.floor(Math.random()*groups[0].length);
  const chosen=groups.map((names,i)=>{
    const index=pairIndex;
    const target=((i===1?180:0)-360*(index+.5)/names.length+360)%360;
    turns[i]+=1800+((target-turns[i]%360+360)%360);
    $(["#femaleWheel","#maleWheel"][i]).style.transform='rotate('+turns[i]+'deg)';
    return names[index];
  });
  $('#spinResult').textContent='Finding your match...';
  const delay=matchMedia('(prefers-reduced-motion: reduce)').matches?50:3000;
  setTimeout(()=>{button.disabled=false;$('#femaleNames').disabled=false;$('#maleNames').disabled=false;$('#spinResult').textContent=chosen.join(' + ');$('#n1').value=chosen[0];$('#n2').value=chosen[1];$('#goDuo').click()},delay);
};

function showDemoVideo(match){
  const status=$('.ai-status');if(!status)return;
  const src=match.a==='Gehlee'&&match.b==='Jeo Ong' ? '/gehlee-jeo.mp4'
    : match.a==='Queen Leng'&&match.b==='Xander Ford' ? '/queen-leng-xander-ford.mp4'
    : match.a==='Kara David'&&match.b==='Dinorobong Tubo' ? '/kara-david-dinorobong-tubo.mp4' : null;
  if(!src){status.textContent='Video coming soon.';return}
  const placeholder=document.createElement('div');
  placeholder.className='video-placeholder';placeholder.textContent='Loading video...';
  const video=document.createElement('video');
  video.controls=true;video.muted=true;video.autoplay=true;video.playsInline=true;video.hidden=true;
  status.setAttribute('aria-busy','true');
  video.addEventListener('loadeddata',()=>{placeholder.remove();video.hidden=false;status.setAttribute('aria-busy','false')},{once:true});
  video.addEventListener('error',()=>{status.setAttribute('aria-busy','false');status.textContent='Video could not be loaded.'},{once:true});
  status.replaceChildren(placeholder,video);video.src=src;
}

$('#out').addEventListener('close',()=>{$('#out video')?.pause()});

$('#goDuo').onclick=()=>{
  const a=$('#n1').value.trim(),b=$('#n2').value.trim();
  if(!a||!b){$('#out').innerHTML='<div class="loading">'+U().errDuo+'</div>';return}
  const m0=match(a,b);
  LASTM=m0;const out=$('#out');out.innerHTML=cardHTML(LASTM);if(!out.open)out.showModal();showDemoVideo(LASTM);
};

document.addEventListener('click',e=>{
  if(!e.target.closest('.save'))return;
  const svg=document.getElementById('scene');if(!svg)return;
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=800;c.height=480;
    c.getContext('2d').drawImage(img,0,0,800,480);
    c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cue-pid-lovestory.png';a.click()})};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg));
});
document.addEventListener('click',e=>{
  const c=e.target.closest('.copy');if(!c||c.classList.contains('save')||c.classList.contains('trailer'))return;
  const txt=decodeURIComponent(c.dataset.copy);
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(
    ()=>c.textContent=U().copied,
    ()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();c.textContent=U().copiedShort});
});

function applyLang(){
  const u=U();
  $('#tag').textContent=u.tag;
  $('#n1').placeholder=u.n1;$('#n2').placeholder=u.n2;$('#goDuo').textContent=u.goDuo;
  $('#foot').textContent=u.foot;
  document.querySelectorAll('.lang button[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  document.documentElement.lang=LANG==='en'?'en':'tl';
}
document.querySelectorAll('.lang button[data-l]').forEach(b=>b.onclick=()=>{
  LANG=b.dataset.l;applyLang();
  if(LASTM&&$('.ai-status')){LASTM=match(LASTM.a,LASTM.b);$('#out').innerHTML=cardHTML(LASTM);animateBars();showDemoVideo(LASTM)}
  else $('#out').innerHTML='';
});
applyLang();
</script>
</body>
</html>
